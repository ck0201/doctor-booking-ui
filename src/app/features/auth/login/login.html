<section class="auth-page">
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted">We will send a one-time code to your mobile number.</p>

    <form (submit)="$event.preventDefault(); requestOtp()">
      <label class="field-label" for="phone">Mobile Number</label>
      <input
        class="form-control"
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        autocomplete="tel"
        placeholder="10-digit number"
        data-testid="phone-input"
        [value]="phone()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'phone-error' : null"
        (input)="phone.set($any($event.target).value)"
      />

      @if (error(); as message) {
        <p class="field-error" id="phone-error" role="alert">{{ message }}</p>
      }

      <button class="btn btn--primary submit" type="submit" data-testid="request-otp">
        Send OTP
      </button>
    </form>

    <p class="note">No password needed. This is a demo sign-in.</p>
  </div>
</section>
