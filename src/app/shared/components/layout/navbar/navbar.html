<nav class="navbar" aria-label="Main">
  <div class="brand">
    <h2>DocBook</h2>
  </div>

  <ul class="links">
    @for (link of links(); track link.route) {
      <li>
        <a
          class="link"
          routerLinkActive="link--active"
          ariaCurrentWhenActive="page"
          [routerLink]="link.route"
          [routerLinkActiveOptions]="{ exact: link.exact }"
        >
          {{ link.label }}
        </a>
      </li>
    }

    @if (isAuthenticated()) {
      <li>
        <button class="link link--action" type="button" data-testid="logout" (click)="logout()">
          Logout
        </button>
      </li>
    }
  </ul>
</nav>
